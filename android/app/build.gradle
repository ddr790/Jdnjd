plugins { id 'com.android.application' }

android {
    namespace 'com.atlas.assistant'
    compileSdk 36

    defaultConfig {
        applicationId 'com.atlas.assistant'
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName '1.1.0'

        def envOrEmpty = { String name ->
            def v = System.getenv(name) ?: ''
            v.replace('\\','\\\\').replace('"','\\"')
        }
        buildConfigField 'String', 'ATLAS_FIREBASE_API_KEY', '"' + envOrEmpty('ATLAS_FIREBASE_API_KEY') + '"'
        buildConfigField 'String', 'ATLAS_FIREBASE_APP_ID', '"' + envOrEmpty('ATLAS_FIREBASE_APP_ID') + '"'
        buildConfigField 'String', 'ATLAS_FIREBASE_PROJECT_ID', '"' + envOrEmpty('ATLAS_FIREBASE_PROJECT_ID') + '"'
        buildConfigField 'String', 'ATLAS_FIREBASE_STORAGE_BUCKET', '"' + envOrEmpty('ATLAS_FIREBASE_STORAGE_BUCKET') + '"'
        buildConfigField 'String', 'ATLAS_FIREBASE_MESSAGING_SENDER_ID', '"' + envOrEmpty('ATLAS_FIREBASE_MESSAGING_SENDER_ID') + '"'
        buildConfigField 'String', 'ATLAS_GOOGLE_SERVER_CLIENT_ID', '"' + envOrEmpty('ATLAS_GOOGLE_SERVER_CLIENT_ID') + '"'
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            def ks = System.getenv('CM_KEYSTORE_PATH') ?: System.getenv('ATLAS_KEYSTORE_PATH')
            def kp = System.getenv('CM_KEYSTORE_PASSWORD') ?: System.getenv('ATLAS_KEYSTORE_PASSWORD')
            def ka = System.getenv('CM_KEY_ALIAS') ?: System.getenv('ATLAS_KEY_ALIAS')
            def kpp = System.getenv('CM_KEY_PASSWORD') ?: System.getenv('ATLAS_KEY_PASSWORD')
            if (ks && kp && ka && kpp) {
                storeFile file(ks)
                storePassword kp
                keyAlias ka
                keyPassword kpp
            }
        }
    }

    buildTypes {
        debug { debuggable true }
        release {
            minifyEnabled false
            shrinkResources false
            debuggable false
            def releaseKs = System.getenv('CM_KEYSTORE_PATH') ?: System.getenv('ATLAS_KEYSTORE_PATH')
            if (releaseKs) signingConfig signingConfigs.release
        }
    }

    packaging { resources { excludes += ['/META-INF/{AL2.0,LGPL2.1}'] } }
}

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation platform('com.google.firebase:firebase-bom:34.19.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'androidx.credentials:credentials:1.3.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.3.0'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}

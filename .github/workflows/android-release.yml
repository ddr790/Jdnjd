name: ATLAS release checks

on:
  workflow_dispatch:

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: yes | sdkmanager --licenses >/dev/null || true
      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          import re, pathlib, subprocess
          s=pathlib.Path('android/app/src/main/assets/public/index.html').read_text()
          for i,b in enumerate(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S)):
              p=f'/tmp/atlas-script-{i}.js'
              pathlib.Path(p).write_text(b)
              subprocess.run(['node','--check',p],check=True)
          PY
      - name: Lint Android release
        run: gradle :android:app:lintRelease
      - name: Build signed AAB when signing secrets are configured
        env:
          ATLAS_KEYSTORE_PATH: /tmp/atlas-upload.jks
          ATLAS_KEYSTORE_PASSWORD: ${{ secrets.ATLAS_KEYSTORE_PASSWORD }}
          ATLAS_KEY_ALIAS: ${{ secrets.ATLAS_KEY_ALIAS }}
          ATLAS_KEY_PASSWORD: ${{ secrets.ATLAS_KEY_PASSWORD }}
          ATLAS_KEYSTORE_BASE64: ${{ secrets.ATLAS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ATLAS_KEYSTORE_BASE64" ]; then
            echo "Release keystore secrets are not configured. Running unsigned release verification only."
            gradle :android:app:bundleRelease
          else
            echo "$ATLAS_KEYSTORE_BASE64" | base64 --decode > "$ATLAS_KEYSTORE_PATH"
            gradle :android:app:bundleRelease
          fi
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: atlas-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
